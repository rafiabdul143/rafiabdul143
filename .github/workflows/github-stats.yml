name: Generate GitHub Profile Stats

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
stats:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate GitHub Stats
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit generated stats
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@users.noreply.github.com"

      git add profile/stats.svg

      git commit -m "Update GitHub profile stats" || exit 0

      git push
```
